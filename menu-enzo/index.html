<style id="appcss">
/* Layout: app de una pantalla por reel (Enzo) + modo armado para el dueño con banco de ideas */
:root{
  --bg:#f4f4f2; --card:#ffffff; --ink:#17181a; --muted:#6a6d72; --line:#e2e2de;
  --disc:#2f6fe0; --disc-soft:#e6eefc; --sell:#d9622b; --sell-soft:#fbeadf; --ok:#23905a; --ok-soft:#e1f3e9;
  --mark:#fff1b8; --mark-ink:#6b4e00; --on:#ffffff; --own:#5b3fd1; --own-soft:#ece7fd;
  --f-d:"Familjen Grotesk","Segoe UI",system-ui,sans-serif; --f-b:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --card:#1a1b1e; --ink:#ececea; --muted:#9a9da3; --line:#2c2e33;
  --disc:#6f9cf0; --disc-soft:#1b2a45; --sell:#ee8a5c; --sell-soft:#3a2317; --ok:#4cc184; --ok-soft:#163626;
  --mark:#4a3b0c; --mark-ink:#ffe08a; --on:#0d0e10; --own:#a995ff; --own-soft:#2a2346; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --card:#1a1b1e; --ink:#ececea; --muted:#9a9da3; --line:#2c2e33;
  --disc:#6f9cf0; --disc-soft:#1b2a45; --sell:#ee8a5c; --sell-soft:#3a2317; --ok:#4cc184; --ok-soft:#163626;
  --mark:#4a3b0c; --mark-ink:#ffe08a; --on:#0d0e10; --own:#a995ff; --own-soft:#2a2346; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-b)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.brand{font:700 15px var(--f-d);letter-spacing:.02em}
.week{font-size:14px;color:var(--muted)}
.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding-block:12px}
.days button{font:700 15px var(--f-d);border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 0 8px;cursor:pointer;display:grid;gap:2px;justify-items:center;min-width:0}
.days button small{font:600 11px var(--f-b);color:var(--muted)}
.days button.cur{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.days button.cur small{color:var(--bg);opacity:.8}
.days button.done:not(.cur){border-color:var(--ok);background:var(--ok-soft)}
.days button.done small{color:var(--ok)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--disc);outline-offset:2px}
.count{font-size:14px;color:var(--muted);text-align:center;margin:-2px 0 8px}
.screen{display:grid;gap:14px}
.type{justify-self:start;font:700 14px var(--f-b);padding:6px 12px;border-radius:99px}
.type.d{background:var(--disc-soft);color:var(--disc)} .type.s{background:var(--sell-soft);color:var(--sell)}
h1{font:700 clamp(26px,7vw,34px)/1.12 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.sn{display:flex;align-items:center;gap:10px;font:700 17px var(--f-d)}
.sn i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:15px;flex:none}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:0;border-radius:14px;font:700 18px var(--f-b);cursor:pointer;text-decoration:none;text-align:center;padding:12px 16px}
.big.watch{background:var(--disc);color:var(--on)}
.big.rec{background:var(--ink);color:var(--bg)}
.big.up{background:var(--card);color:var(--ok);border:2px solid var(--ok)}
.big.up.yes{background:var(--ok);color:var(--on)}
.proof{margin:0;font-size:15px;color:var(--muted);text-align:center}
.proof b{color:var(--ink)}
.lines{display:grid;gap:10px;margin:0}
.lines p{margin:0;font-size:18px;line-height:1.45}
.lines .k{display:block;font:700 12px var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px;font-weight:600}
.word{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px}
.word b{font:700 18px var(--f-d);background:var(--ink);color:var(--bg);padding:3px 10px;border-radius:8px;letter-spacing:.04em}
.tip{margin:0;font-size:15px;color:var(--muted)}
.warn{font-size:14px;color:var(--mark-ink);background:var(--mark);padding:8px 12px;border-radius:10px;margin:0}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{flex:1;font:600 16px var(--f-b);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.end{text-align:center;font-size:15px;color:var(--muted);margin:6px 0 0}
.tele{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(20px,env(safe-area-inset-left,0px))}
.tele .tb{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tele .tb button{font:700 16px var(--f-b);background:#fff;color:#000;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.tele .tb span{font-size:14px;opacity:.7}
.tele .txt{flex:1;overflow-y:auto;margin-top:16px;font:600 36px/1.3 var(--f-b);display:grid;gap:28px;align-content:start;padding-bottom:40vh}
.tele .txt p{margin:0}
.tele mark{background:#ffe066;color:#000}
.tele .sz{display:flex;gap:8px}
/* Modo dueño */
.ownbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--own-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.ownbar span{flex:1;min-width:140px;color:var(--own);font-weight:600}
.ownbar button,.btn{font:600 15px var(--f-b);border:1px solid var(--own);background:var(--card);color:var(--own);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.solid{background:var(--own);color:var(--on);border-color:var(--own)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.edit{display:grid;gap:12px}
.edit h2{font:700 24px/1.15 var(--f-d);margin:4px 0 0}
.edit .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edit label{font-size:14px;color:var(--muted);display:grid;gap:4px}
.edit input,.edit textarea{font:16px/1.4 var(--f-b);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
.edit textarea{min-height:150px;resize:vertical}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.slot .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot .d{font:700 15px var(--f-d);min-width:34px}
.slot h3{font:700 18px/1.25 var(--f-d);margin:0}
.slot .meta{font-size:14px;color:var(--muted);margin:0}
.slot .meta a{color:inherit}
.pill{font:700 12px var(--f-b);padding:3px 9px;border-radius:99px}
.pill.d{background:var(--disc-soft);color:var(--disc)} .pill.s{background:var(--sell-soft);color:var(--sell)}
.status{font-size:14px;color:var(--muted);margin:0;min-height:1.4em}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:600px;max-height:85vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;box-sizing:border-box}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .hd b{font:700 19px var(--f-d)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:600 14px var(--f-b);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.opt .r{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.opt .used{font-size:12px;color:var(--muted)}
.empty{font-size:15px;color:var(--muted);text-align:center;padding:20px 0}
.swap{display:flex;gap:8px;flex-wrap:wrap}
.swap button{font:600 15px var(--f-b);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
.pill.t{background:var(--mark);color:var(--mark-ink)}

  <p class="count" style="margin-top:12px">${remoteState==="error"?"No pude leer los datos. Reintento solo en unos segundos.":`Subió <b>${n} de ${WEEK.items.length}</b> · se actualiza solo cada 15 segundos${lastPull?" (última: "+lastPull.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})+")":""}`}</p>
  <section class="edit">${WEEK.items.map((x,i)=>{const r=by[i],ch=r&&r.cambio_id?BANK.find(b=>b.id===r.cambio_id):null,it=ch||x;
    return `<div class="slot"><div class="top"><span class="d">${DAYS[i]}</span><span class="pill ${it.t}">${it.t==="d"?"Gente nueva":"Para vender"}</span>${r&&r.subido?'<span class="pill" style="background:var(--ok-soft);color:var(--ok)">✓ Subido</span>':'<span class="pill" style="background:var(--line);color:var(--muted)">Sin subir</span>'}${ch?'<span class="pill t">🔄 Lo cambió</span>':""}</div>
    <h3>${esc(it.title)}</h3>${ch?`<p class="meta">Tu elección era: ${esc(x.title)}</p>`:""}${r?`<p class="meta">Último toque: ${esc(when(r.updated_at))}</p>`:""}</div>`}).join("")}
  <p class="status">Quedan <b>${left}</b> ideas sin usar en el banco para cambiar.</p></section></div>`;
}
let cur=(()=>{const d=new Date().getDay();return d>=1&&d<=6?d-1:0})();
if(cur>=WEEK.items.length)cur=0;
let fs=36, mode="enzo", owner=false, db=null, artifact=null, bank=[], bankState="loading", draft=null, sugerida=null, pickFor=null, pickFilter="all", confirmPub=false, statusMsg="";

/* ---------- Vista de Enzo ---------- */
function enzoView(){
  const R=WEEK.items.map((_,i)=>itemFor(i)), r=R[cur];
  if(!r) return `<div class="wrap"><p class="empty">Todavía no hay reels cargados para esta semana.</p></div>`;
  const n=R.filter((_,i)=>st[i]).length, has=r.s.some(([,v])=>String(v).includes("["));
  return `<div class="wrap">${owner?ownBar():""}
  <div class="head"><span class="brand">MobileStore · Reels</span><span class="week">${esc(WEEK.label)}</span></div>
  <nav class="days" aria-label="Días">${R.map((x,i)=>`<button type="button" data-day="${i}" class="${i===cur?"cur ":""}${st[i]?"done":""}" aria-label="${esc(DAYS[i]+": "+x.title)}">${DAYS[i]}<small>${st[i]?"✓ listo":(x.t==="d"?"nuevo":"vender")}</small></button>`).join("")}</nav>
  <p class="count">${n===R.length?"¡Semana completa! Avisale a Franco cuántas consultas te entraron.":`Llevás ${n} de ${R.length} subidos`}</p>
  <main class="screen">
    <span class="type ${r.t}">${r.t==="d"?"Para que te conozca gente nueva":"Para vender"}</span>
    <h1>${esc(r.title)}</h1>
    ${BANK.length?`<div class="swap"><button type="button" data-act="epick">🔄 Cambiar este reel</button>${ov[cur]?`<button type="button" data-act="eback">↩ Volver al que eligió Franco</button>`:""}</div>`:""}
    <section class="step"><div class="sn"><i>1</i>Mirá el video que vas a copiar</div>
      <a class="big watch" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">▶ Ver el video original</a>
      <p class="proof">Lo hizo ${esc(r.who)}: <b>${esc(r.views)}</b>. Copiá cómo lo hace.</p></section>
    <section class="step"><div class="sn"><i>2</i>Grabá esto</div>
      ${has?'<p class="warn">Lo amarillo lo completás vos antes de grabar.</p>':''}
      <div class="lines">${r.s.map(([k,v])=>`<p><span class="k">${esc(k)}</span>${fill(v)}</p>`).join("")}</div>
      <div class="word">Al final pedí que comenten: <b>${esc(r.word)}</b></div>
      ${r.tip?`<p class="tip">💡 ${esc(r.tip)}</p>`:""}
      <button class="big rec" type="button" data-act="tele">🎬 Leer el guion mientras grabo</button></section>
    <section class="step"><div class="sn"><i>3</i>Cuando lo subas, tocá acá</div>
      <button class="big up ${st[cur]?"yes":""}" type="button" data-act="up">${st[cur]?"✓ Ya lo subí":"Ya lo subí"}</button></section>
    <div class="nav"><button type="button" data-act="prev" ${cur===0?"disabled":""}>← Anterior</button><button type="button" data-act="next" ${cur===R.length-1?"disabled":""}>Siguiente →</button></div>
    <p class="end">Cualquier duda, mandale un audio a Franco.</p>
  </main>${pickFor!=null&&mode==="enzo"?pickView():""}</div>`;
}
function teleView(){
  const r=itemFor(cur);
  return `<div class="tele" role="dialog" aria-label="Guion para grabar"><div class="tb"><button type="button" data-act="teleclose">✕ Cerrar</button><span>Leé de acá mientras grabás</span><div class="sz"><button type="button" data-act="smaller" aria-label="Letra más chica">A−</button><button type="button" data-act="bigger" aria-label="Letra más grande">A+</button></div></div>
  <div class="txt" style="font-size:${fs}px">${r.s.map(([,v])=>`<p>${fill(v)}</p>`).join("")}</div></div>`;
}

/* ---------- Modo dueño ---------- */
function ownBar(){
  return `<div class="ownbar"><span>Solo vos ves esta barra</span><a class="btn" href="https://gutierrezfranco.github.io/apple/menu-enzo/?panel=1" target="_blank" rel="noopener" style="text-decoration:none">📊 Qué marcó Enzo</a>${mode==="enzo"?`<button type="button" data-act="toedit">✏️ Armar semana</button>`:`<button type="button" data-act="toenzo">👀 Ver como Enzo</button>`}</div>`;
}
function editView(){
  const D=draft;
  return `<div class="wrap">${ownBar()}<section class="edit">
    <h2>Armar la semana de Enzo</h2>
    <p class="status">Cambiá lo que no te guste. Enzo no ve nada hasta que toques <b>Publicar para Enzo</b>.</p>
    <label>Semana (lo que ve arriba)<input id="lbl" type="text" value="${esc(D.label)}"></label>
    <div class="row">${sugerida?`<button class="btn" type="button" data-act="loadsug">📥 Cargar la semana sugerida (${esc(sugerida.label||"")})</button>`:""}
      <span class="status">${bankState==="loading"?"Cargando el banco de ideas…":bankState==="slow"?"El banco de ideas tarda en cargar; podés seguir editando.":bankState==="error"?"No se pudo cargar el banco de ideas.":`Banco: ${bank.length} ideas`}</span></div>
    ${D.items.map((x,i)=>`<div class="slot"><div class="top"><span class="d">${DAYS[i]}</span><span class="pill ${x.t}">${x.t==="d"?"Gente nueva":"Para vender"}</span></div>
      <h3>${esc(x.title)}</h3><p class="meta"><a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">▶ original</a> · ${esc(x.views)} · palabra: ${esc(x.word)}</p>
      <div class="row"><button class="btn" type="button" data-act="pick" data-i="${i}">🔄 Cambiar</button><button class="btn ghost" type="button" data-act="edtx" data-i="${i}">✍️ ${x._open?"Cerrar guion":"Editar guion"}</button></div>
      ${x._open?`<label>Guion (una línea por parte: "Parte: texto"; lo que va entre [corchetes] sale en amarillo)<textarea data-g="${i}">${esc(x.s.map(([k,v])=>k+": "+v).join("\n"))}</textarea></label>
      <label>Palabra para comentar<input type="text" data-w="${i}" value="${esc(x.word)}"></label>
      <label>Consejo para grabar<input type="text" data-tp="${i}" value="${esc(x.tip||"")}"></label>`:""}</div>`).join("")}
    <button class="big" type="button" data-act="publish" style="background:var(--own);color:var(--on)">${confirmPub?"¿Seguro? Tocá de nuevo para publicar":"🚀 Publicar para Enzo"}</button>
    <p class="status" aria-live="polite">${esc(statusMsg)}</p>
  </section>${pickFor!=null?pickView():""}</div>`;
}
function pickView(){
  const ed=mode==="edit";
  const inWeek=new Set(ed?draft.items.map(x=>x.id):WEEK.items.map((_,i)=>itemFor(i).id));
  const src=ed?bank:BANK;
  const list=src.filter(b=>pickFilter==="all"||b.t===pickFilter);
  return `<div class="sheet" data-act="closepick"><div class="in" data-stop="1" role="dialog" aria-label="Elegir reel">
    <div class="hd"><b>Elegí para el ${DAYS[pickFor]}</b><button class="btn ghost" type="button" data-act="closepick">✕</button></div>
    <div class="chips">${[["all","Todos"],["d","Gente nueva"],["s","Para vender"]].map(([k,l])=>`<button type="button" data-act="filt" data-f="${k}" class="${pickFilter===k?"on":""}">${l}</button>`).join("")}</div>
    ${list.length?list.map(b=>`<div class="opt"><div class="r"><span class="pill ${b.t}">${b.t==="d"?"Gente nueva":"Para vender"}</span>${b.test?'<span class="pill t">🧪 prueba</span>':""}${inWeek.has(b.id)?'<span class="used">ya está en la semana</span>':""}</div>
      <h4>${esc(b.title)}</h4><p>${esc(b.views)} · ${esc(b.who)}</p>
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost" href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener" style="text-decoration:none">▶ Ver</a><button class="btn solid" type="button" data-act="choose" data-id="${esc(b.id)}">${ed?"Elegir":"Usar este"}</button></div></div>`).join(""):`<p class="empty">${!ed||bankState==="ready"?"No hay ideas de este tipo todavía.":"El banco todavía está cargando."}</p>`}
  </div></div>`;
}

/* ---------- Render y eventos ---------- */
let tele=false;
function render(){
  syncDraft();
  root.innerHTML=isPanel?panelView():(mode==="edit"&&owner&&draft?editView():enzoView())+(tele&&mode==="enzo"?teleView():"");
}
function syncDraft(){
  if(!draft)return;
  root.querySelectorAll("textarea[data-g]").forEach(t=>{const i=+t.dataset.g;draft.items[i].s=t.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^([^:]{1,30}):\s*(.*)$/);return m?[m[1].trim(),m[2]]:["",l]})});
  root.querySelectorAll("input[data-w]").forEach(t=>{draft.items[+t.dataset.w].word=t.value});
  root.querySelectorAll("input[data-tp]").forEach(t=>{draft.items[+t.dataset.tp].tip=t.value});
  const l=root.querySelector("#lbl");if(l)draft.label=l.value;
}
root.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-day]");if(!el)return;
  if(el.dataset.stop&&!e.target.closest("[data-act]"))return;
  if(el.dataset.day!=null){cur=+el.dataset.day;render();return}
  const a=el.dataset.act;
  if(a==="closepick"&&e.target.closest("[data-stop]")&&!e.target.closest('button[data-act="closepick"]'))return;
  switch(a){
    case "prev":cur--;render();scrollTo(0,0);break;
    case "next":cur++;render();scrollTo(0,0);break;
    case "up":st[cur]=!st[cur];save();push(cur);if(st[cur]&&cur<WEEK.items.length-1){render();setTimeout(()=>{cur++;render();scrollTo({top:0,behavior:"smooth"})},700)}else render();break;
    case "tele":tele=true;render();try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(_){};break;
    case "teleclose":tele=false;render();break;
    case "bigger":fs=Math.min(60,fs+4);render();break;
    case "smaller":fs=Math.max(22,fs-4);render();break;
    case "toedit":mode="edit";if(!draft)draft=JSON.parse(JSON.stringify(WEEK));confirmPub=false;statusMsg="";render();scrollTo(0,0);break;
    case "toenzo":syncDraft();mode="enzo";render();scrollTo(0,0);break;
    case "pick":syncDraft();pickFor=+el.dataset.i;pickFilter=draft.items[pickFor].t||"all";render();break;
    case "closepick":pickFor=null;render();break;
    case "filt":pickFilter=el.dataset.f;render();break;
    case "choose":{if(mode==="edit"){const b=bank.find(x=>x.id===el.dataset.id);if(b){draft.items[pickFor]=cleanItem(b)};confirmPub=false}else{const b=BANK.find(x=>x.id===el.dataset.id);if(b){ov[cur]=b.id;saveOv();st[cur]=false;save();push(cur)}};pickFor=null;render();scrollTo(0,0);break}
    case "epick":pickFor=cur;pickFilter=itemFor(cur).t||"all";render();break;
    case "eback":delete ov[cur];saveOv();push(cur);render();break;
    case "edtx":syncDraft();const it=draft.items[+el.dataset.i];it._open=!it._open;render();break;
    case "loadsug":{syncDraft();const items=(sugerida.ids||[]).map(id=>bank.find(b=>b.id===id)).filter(Boolean).map(cleanItem);if(items.length){draft.items=items.slice(0,6);while(draft.items.length<6&&WEEK.items[draft.items.length])draft.items.push(WEEK.items[draft.items.length]);if(sugerida.label)draft.label=sugerida.label;statusMsg="Cargué la semana sugerida. Revisala y publicala.";}else statusMsg="La semana sugerida no tiene ideas que estén en el banco.";confirmPub=false;render();break}
    case "publish":publish();break;
  }
});
function cleanItem(b){return {id:b.id,t:b.t,title:b.title,url:b.url,views:b.views,who:b.who,word:b.word,s:(b.s||[]).map(p=>Array.isArray(p)?[String(p[0]),String(p[1])]:(p&&typeof p==="object")?[String(p.k||""),String(p.v||"")]:["",String(p)]),tip:b.tip||""}}

/* ---------- Publicar (reescribe la página con la semana nueva) ---------- */
async function publish(){
  syncDraft();
  if(!confirmPub){confirmPub=true;statusMsg="";render();return}
  confirmPub=false;
  if(!artifact){statusMsg="No pude publicar desde acá. Pedímelo en el chat.";render();return}
  const week={label:draft.label||WEEK.label,key:"ms-"+Date.now(),items:draft.items.slice(0,6).map(cleanItem)};
  const json=JSON.stringify(week).replace(/</g,"\\u003c");
  const css=document.getElementById("appcss").textContent;
  const js=document.getElementById("appjs").textContent;
  const head=document.querySelector('link[rel="stylesheet"]');
  const doc='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'
   +'<title>Menú MobileStore</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
   +'<link rel="stylesheet" href="'+(head?head.getAttribute("href"):"")+'">\n'
   +'<style id="appcss">'+css+'</style>\n'
   +'<script type="application/json" id="weekdata">'+json+'<\/script>\n'
   +'<script type="application/json" id="bankdata">'+JSON.stringify((bank.length?bank:BANK).map(b=>Object.assign(cleanItem(b),{test:!!b.test}))).replace(/</g,"\\u003c")+'<\/script>\n<div id="root"></div>\n'
   +'<script id="appjs">'+js+'<\/script>'
   +'</body></html>';
  statusMsg="Publicando…";render();
  try{await artifact.publish(doc);statusMsg="Listo, Enzo ya ve la semana nueva.";}
  catch(err){const c=err&&err.code;statusMsg=c==="conflict"?"Se publicó otra versión al mismo tiempo. Volvé a intentar.":"No se pudo publicar ("+(c||"error")+").";render()}
}

/* ---------- Arranque ---------- */
render();
if(PUB){pull();if(isPanel)setInterval(pull,15000);else document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()})}
(async()=>{
  const user=await (window.claude&&claude.use?claude.use("user"):null);
  owner=user?await user.isOwner():false;
  if(!owner)return;
  render();
  artifact=await claude.use("artifact");
  db=await claude.use("db");
  if(!db){bankState="error";render();return}
  const t=setTimeout(()=>{if(bankState==="loading"){bankState="slow";render()}},10000);
  db.collection("banco").onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(t);bank=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String(b.agregado||"").localeCompare(String(a.agregado||""))||a.id.localeCompare(b.id));bankState="ready";if(mode==="edit")render()},()=>{clearTimeout(t);bankState="error";if(mode==="edit")render()});
  db.doc("semana/sugerida").onSnapshot(d=>{sugerida=d.exists?d.data():null;if(mode==="edit")render()},()=>{});
})();
})();
</script>

</body></html>
